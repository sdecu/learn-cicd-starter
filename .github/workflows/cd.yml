name: cd

on:
  push:
    branches: [main]

jobs:
  Deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest
        
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: buildprod
        run: scripts/buildprod.sh

      - name: migrate database
        run: scripts/migrateup.sh
        
      - name: check for sensitive credentials
        run: git diff
              
      - name: Set up gcloud Cloud SDK environment
        uses: google-github-actions/setup-gcloud@v2.1.1

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 'Use gcloud CLI'
        run: 'gcloud info'

      - name: build with google
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-432520/notely-ar-repo/sdecu/notely:latest .

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-432520/notely-ar-repo/sdecu/notely:latest --region us-central1 --allow-unauthenticated --project notely-432520 --max-instances=4
