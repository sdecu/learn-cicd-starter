name: cd

on:
  push:
    branches: [main]

jobs:
  Deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: build source file
        run: scripts/buildprod.sh

              
      - name: Set up gcloud Cloud SDK environment
        uses: google-github-actions/setup-gcloud@v2.1.1

      - name: build with google
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-432520/notely-ar-repo/sdecu/notely:latest .
            
